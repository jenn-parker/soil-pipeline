<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soil sample map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; color: #17362d; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.8rem 1rem; background: #f4f7f2; }
      h1 { margin: 0; font-size: 1.1rem; }
      #status { color: #52645d; font-size: 0.9rem; }
      #map { height: calc(100vh - 58px); min-height: 360px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Soil sample locations</h1>
      <div id="status" role="status">Loading samples…</div>
    </header>
    <div id="map" aria-label="Map of soil sample locations"></div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const map = L.map("map").setView([39.5, -98.35], 4);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      const markers = L.layerGroup().addTo(map);
      const status = document.getElementById("status");
      let requestId = 0;
      async function loadSamples() {
        const id = ++requestId;
        const bounds = map.getBounds();
        const params = new URLSearchParams({
          west: bounds.getWest(), south: bounds.getSouth(),
          east: bounds.getEast(), north: bounds.getNorth(), limit: 5000
        });
        status.textContent = "Loading samples…";
        try {
          const response = await fetch(`/api/v1/maps/soil-samples?${params}`);
          if (!response.ok) throw new Error(`Request failed (${response.status})`);
          const data = await response.json();
          if (id !== requestId) return;
          markers.clearLayers();
          for (const feature of data.features) {
            const [longitude, latitude] = feature.geometry.coordinates;
            const sample = feature.properties;
            const marker = L.circleMarker([latitude, longitude], {
              radius: 7, color: "#245b45", fillColor: "#76a66b", fillOpacity: 0.85
            });
            const popup = document.createElement("div");
            const title = document.createElement("strong");
            title.textContent = sample.sample_id;
            popup.append(title);
            if (sample.field_name) popup.append(document.createElement("br"), document.createTextNode(sample.field_name));
            popup.append(document.createElement("br"), document.createTextNode(`pH: ${sample.soil_ph ?? "not recorded"}`));
            popup.append(document.createElement("br"), document.createTextNode(`Sampled: ${new Date(sample.sampled_at).toLocaleDateString()}`));
            marker.bindPopup(popup).addTo(markers);
          }
          status.textContent = `${data.features.length} samples in this view (maximum 5,000)`;
        } catch (error) {
          if (id === requestId) status.textContent = `Could not load samples: ${error.message}`;
        }
      }
      map.on("moveend", loadSamples);
      loadSamples();
    </script>
  </body>
</html>
